name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set — skipping deploy."
          fi
      - uses: actions/checkout@v5
        if: steps.cf.outputs.configured == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.cf.outputs.configured == 'true'
      - if: steps.cf.outputs.configured == 'true'
        run: bun install --frozen-lockfile
      - if: steps.cf.outputs.configured == 'true'
        run: bun run build
      - name: Ensure Pages project exists
        if: steps.cf.outputs.configured == 'true'
        run: bunx wrangler pages project create idle-dungeon-crawler --production-branch main || true
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.configured == 'true'
        run: bunx wrangler pages deploy
